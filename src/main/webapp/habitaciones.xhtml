<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" template="/WEB-INF/templates/layout.xhtml">
<ui:param name="page" value="habitaciones"/><ui:define name="title">Habitaciones</ui:define><ui:define name="subtitle">Consulte el catálogo, la capacidad y las tarifas por noche.</ui:define>
<ui:define name="content"><div class="row g-4"><ui:repeat value="#{hotelBean.rooms}" var="r"><div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><span class="room-number">#{r.numero}</span><span class="badge-soft">#{r.tipo}</span></div><p class="text-secondary small"><h:outputText value="#{r.descripcion}"/></p><p class="small">Capacidad: #{r.capacidad} huéspedes</p><div class="d-flex justify-content-between align-items-center border-top pt-3"><strong>#{r.tarifa}<small class="text-secondary fw-normal"> / noche</small></strong><span class="hint">#{r.habilitada ? 'Habilitada' : 'No habilitada'}</span></div></div></div></div></ui:repeat></div><p class="hint mt-4">La disponibilidad para fechas específicas se comprueba al guardar una nueva reserva.</p></ui:define></ui:composition>

<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" template="/WEB-INF/templates/layout.xhtml">
<ui:param name="page" value="huespedes"/><ui:define name="title">Huéspedes</ui:define><ui:define name="subtitle">Registre los datos de contacto y consulte el directorio.</ui:define>
<ui:define name="content"><div class="row g-4"><div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="mb-4">Registrar huésped</h2>
<h:form id="guest"><div class="mb-3"><h:outputLabel for="nombre" value="Nombre completo" styleClass="form-label"/><h:inputText id="nombre" value="#{hotelBean.nombre}" required="true" requiredMessage="Ingrese el nombre completo." maxlength="100" styleClass="form-control"><f:validateLength minimum="3" maximum="100"/></h:inputText><h:message for="nombre" styleClass="field-error"/></div>
<div class="mb-3"><h:outputLabel for="documento" value="DNI o pasaporte" styleClass="form-label"/><h:inputText id="documento" value="#{hotelBean.documento}" required="true" requiredMessage="Ingrese el documento." maxlength="15" styleClass="form-control"><f:validateLength minimum="6" maximum="15"/></h:inputText><h:message for="documento" styleClass="field-error"/></div>
<div class="mb-3"><h:outputLabel for="telefono" value="Teléfono" styleClass="form-label"/><h:inputText id="telefono" value="#{hotelBean.telefono}" required="true" requiredMessage="Ingrese el teléfono." maxlength="20" styleClass="form-control"><f:validateLength minimum="6" maximum="20"/></h:inputText><h:message for="telefono" styleClass="field-error"/></div>
<div class="mb-4"><h:outputLabel for="email" value="Correo electrónico (opcional)" styleClass="form-label"/><h:inputText id="email" value="#{hotelBean.email}" maxlength="100" styleClass="form-control"/><h:message for="email" styleClass="field-error"/></div>
<h:commandButton id="save" value="Guardar huésped" action="#{hotelBean.saveGuest}" styleClass="btn btn-primary w-100" disabled="#{not hotelBean.available}"/><p class="hint mt-3 mb-0">Cada documento identifica a un solo huésped.</p></h:form>
</div></div></div><div class="col-lg-8"><div class="card"><div class="card-body"><h2 class="mb-3">Directorio de huéspedes</h2><h:form id="search"><div class="filter-bar"><div><h:outputLabel for="q" value="Buscar por nombre o documento" styleClass="form-label"/><h:inputText id="q" value="#{hotelBean.query}" maxlength="100" styleClass="form-control"/></div><h:commandButton id="submit" value="Buscar" action="#{hotelBean.searchGuests}" styleClass="btn btn-outline-primary"/></div></h:form></div>
<div class="table-responsive"><h:dataTable id="guests" value="#{hotelBean.guests}" var="g" rows="10" first="#{hotelBean.first}" styleClass="table" rendered="#{not empty hotelBean.guests}"><h:column><f:facet name="header">Nombre</f:facet><h:outputText value="#{g.nombre}"/></h:column><h:column><f:facet name="header">Documento</f:facet><h:outputText value="#{g.documento}"/></h:column><h:column><f:facet name="header">Teléfono</f:facet><h:outputText value="#{g.telefono}"/></h:column><h:column><f:facet name="header">Correo</f:facet><h:outputText value="#{g.email}"/></h:column></h:dataTable></div>
<h:panelGroup rendered="#{empty hotelBean.guests}" layout="block" styleClass="empty">No hay huéspedes que mostrar.</h:panelGroup>
<h:form id="pages" styleClass="d-flex justify-content-between align-items-center p-3 border-top"><h:commandButton value="Anterior" action="#{hotelBean.previous}" disabled="#{hotelBean.first eq 0}" styleClass="btn btn-sm btn-outline-secondary"/><span class="hint">Página #{hotelBean.page} · #{hotelBean.guests.size()} registros</span><h:commandButton value="Siguiente" action="#{hotelBean.next}" disabled="#{not hotelBean.moreGuests}" styleClass="btn btn-sm btn-outline-secondary"/></h:form>
</div></div></div></ui:define></ui:composition>
